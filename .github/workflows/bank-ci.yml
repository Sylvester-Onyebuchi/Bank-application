name: Bank-app CI/CD

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      SERVER_PORT: ${{ vars.SERVER_PORT }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DDL_AUTO: ${{ secrets.DDL_AUTO }}

      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

      MAIL_HOST: ${{ secrets.MAIL_HOST }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

      TRANSFER_QUEUE: ${{ vars.TRANSFER_QUEUE }}
      TRANSFER_EXCHANGE: ${{ vars.TRANSFER_EXCHANGE }}
      TRANSFER_ROUTING_KEY: ${{ vars.TRANSFER_ROUTING_KEY }}

      WITHDRAW_QUEUE: ${{ vars.WITHDRAW_QUEUE }}
      WITHDRAW_EXCHANGE: ${{ vars.WITHDRAW_EXCHANGE }}
      WITHDRAW_ROUTING_KEY: ${{ vars.WITHDRAW_ROUTING_KEY }}

      DEPOSIT_QUEUE: ${{ vars.DEPOSIT_QUEUE }}
      DEPOSIT_EXCHANGE: ${{ vars.DEPOSIT_EXCHANGE }}
      DEPOSIT_ROUTING_KEY: ${{ vars.DEPOSIT_ROUTING_KEY }}

      ACCOUNT_QUEUE: ${{ vars.ACCOUNT_QUEUE }}
      ACCOUNT_EXCHANGE: ${{ vars.ACCOUNT_EXCHANGE }}
      ACCOUNT_ROUTING_KEY: ${{ vars.ACCOUNT_ROUTING_KEY }}

      STATEMENT_QUEUE: ${{ vars.STATEMENT_QUEUE }}
      STATEMENT_EXCHANGE: ${{ vars.STATEMENT_EXCHANGE }}
      STATEMENT_ROUTING_KEY: ${{ vars.STATEMENT_ROUTING_KEY }}

      RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
      RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
      RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
      RABBITMQ_VIRTUAL_HOST: ${{ secrets.RABBITMQ_VIRTUAL_HOST }}

      AWS_COGNITO_USER_POOL: ${{ secrets.AWS_COGNITO_USER_POOL }}
      AWS_COGNITO_CLIENT_ID: ${{ secrets.AWS_COGNITO_CLIENT_ID }}
      AWS_COGNITO_CLIENT_SECRET: ${{ secrets.AWS_COGNITO_CLIENT_SECRET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      JWT_ISSUER_URI: ${{ secrets.JWT_ISSUER_URI }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Check required env vars
        run: |
          test -n "$DB_URL" || (echo "DB_URL missing" && exit 1)
          test -n "$DB_USERNAME" || (echo "DB_USERNAME missing" && exit 1)
          test -n "$DB_PASSWORD" || (echo "DB_PASSWORD missing" && exit 1)
          test -n "$JWT_ISSUER_URI" || (echo "JWT_ISSUER_URI missing" && exit 1)
          test -n "$AWS_COGNITO_CLIENT_ID" || (echo "AWS_COGNITO_CLIENT_ID missing" && exit 1)
          echo "Required env vars exist"

      - name: Run JUnit Tests
        run: ./mvnw test -e

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Check Docker Username
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "DOCKER_USERNAME is empty"
            exit 1
          fi
          echo "Docker username exists"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/bank-app:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/bank-app:latest